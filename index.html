<!doctype html>
<html lang="ku">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nirxandina Peyvên Kurmancî</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F2F4F1; --surface:#FFFFFF; --ink:#172019; --muted:#5F6B64; --line:#D5DBD6; --line-strong:#B9C2BC;
  --accent:#0E6B4F; --accent-ink:#FFFFFF; --accent-soft:#DCEFE6; --sun:#D9A21B; --sun-soft:#FBF1D6;
  --ok:#1F7A4D; --ok-soft:#DFF2E7; --bad:#B5382C; --bad-soft:#F8E1DD; --exp:#B9791A; --exp-soft:#FBEBD0;
  --lin:#5B4BB5; --lin-soft:#E6E1F7; --src:#4F6D8A; --src-soft:#DFE8F0; --focus:#0E6B4F;
  --shadow:0 1px 2px rgba(23,32,25,.06), 0 8px 24px rgba(23,32,25,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101613; --surface:#182019; --ink:#E6EBE7; --muted:#9AA7A0; --line:#2A352E; --line-strong:#3C4A41;
    --accent:#5CC59A; --accent-ink:#0B1A13; --accent-soft:#1C3A2E; --sun:#E4B23A; --sun-soft:#3A2F12;
    --ok:#5CC59A; --ok-soft:#1B3527; --bad:#E5796C; --bad-soft:#3D1F1B; --exp:#E0A64A; --exp-soft:#3A2B12;
    --lin:#A99AEE; --lin-soft:#2A2545; --src:#8FB0CC; --src-soft:#1F2C38; --focus:#5CC59A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-block:0 32px;padding-inline:16px}
button{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px 10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px;background:var(--surface);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font:500 19px/1.2 "IBM Plex Serif",Georgia,serif;margin:0;letter-spacing:-.01em}
.brand .letters{font-family:"IBM Plex Serif",Georgia,serif;font-style:italic;color:var(--accent);font-size:15px;letter-spacing:.14em}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--surface)}
.chip b{font-weight:600}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=email],input[type=password]{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;font:inherit;background:var(--surface);color:var(--ink)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}

.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;margin-top:18px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
.rail{position:sticky;top:64px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 80px);overflow:auto;padding-right:4px}
@media (max-width:860px){.rail{position:static;max-height:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel .hd{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel .bd{padding:12px 14px}

.progress{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.legend .k{display:flex;align-items:center;gap:8px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.d-approved{background:var(--ok)}.d-metadata{background:var(--accent)}.d-rejected{background:var(--bad)}.d-experimental{background:var(--exp)}.d-linguist{background:var(--lin)}.d-source{background:var(--src)}.d-pending{background:var(--line-strong)}

.blocks{display:flex;flex-direction:column;max-height:46vh;overflow:auto}
@media (max-width:860px){.blocks{max-height:32vh}}
.blk{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:7px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.blk:first-child{border-top:0}
.blk:hover{background:var(--accent-soft)}
.blk.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.blk .n{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted)}
.blk .range{font-size:13px}
.blk .mini{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px;display:flex}
.blk .mini span{display:block;height:100%;background:var(--ok)}
.blk .who{font-size:11.5px;color:var(--muted);white-space:nowrap}
.blk .who.me{color:var(--sun)}

.focus{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 22px 20px}
.focus .meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.focus .meta .rank{font-family:"IBM Plex Mono",monospace}
.word{font:500 44px/1.15 "IBM Plex Serif",Georgia,serif;margin:10px 0 2px;letter-spacing:-.01em;overflow-wrap:anywhere}
.word small{font:italic 400 18px/1 "IBM Plex Serif",Georgia,serif;color:var(--muted);margin-left:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 18px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.fact .l{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.fact .v{font-size:15px;margin-top:2px}
.flag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;background:var(--sun-soft);color:var(--ink);border:1px solid var(--sun);margin-right:4px}
.note-hint{font-size:13px;color:var(--muted);margin-top:10px}

.decide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
@media (max-width:700px){.decide{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dbtn{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 12px 12px 18px;cursor:pointer;text-align:left;min-height:88px;--c:var(--muted);--csoft:var(--ground)}
.dbtn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:9px 0 0 9px;background:var(--c)}
.dbtn .head{display:flex;align-items:center;gap:8px;width:100%}
.dbtn .key{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;line-height:16px;margin-left:auto}
.dbtn .t{font-weight:600;font-size:15px;color:var(--c)}
.dbtn .code{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);letter-spacing:.01em}
.dbtn .s{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:3px}
.dbtn:hover{border-color:var(--c);background:var(--csoft)}
.dbtn.on{border-color:var(--c);background:var(--csoft);box-shadow:0 0 0 2px var(--csoft)}
.dbtn[data-s="approved"]{--c:var(--ok);--csoft:var(--ok-soft)}
.dbtn[data-s="metadata"]{--c:var(--accent);--csoft:var(--accent-soft)}
.dbtn[data-s="rejected"]{--c:var(--bad);--csoft:var(--bad-soft)}
.dbtn[data-s="experimental"]{--c:var(--exp);--csoft:var(--exp-soft)}
.dbtn[data-s="linguist"]{--c:var(--lin);--csoft:var(--lin-soft)}
.dbtn[data-s="source"]{--c:var(--src);--csoft:var(--src-soft)}
.noterow{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.noterow input{flex:1 1 260px;min-width:0;width:auto}
.reasons{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.reason{border:1px solid var(--line);background:var(--ground);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.reason:hover{border-color:var(--accent)}
.navrow{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.navrow .spacer{flex:1}
.status-line{font-size:13px;color:var(--muted);min-height:20px;margin-top:8px}
.status-line.warn{color:var(--bad)}

.tbl{margin-top:18px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--ground)}
tr.row.cur td{background:var(--accent-soft)}
td.w{font-family:"IBM Plex Serif",Georgia,serif;font-size:16px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:500;white-space:nowrap}
.p-approved{background:var(--ok-soft);color:var(--ok)}.p-metadata{background:var(--accent-soft);color:var(--accent)}.p-rejected{background:var(--bad-soft);color:var(--bad)}.p-experimental{background:var(--exp-soft);color:var(--exp)}.p-linguist{background:var(--lin-soft);color:var(--lin)}.p-source{background:var(--src-soft);color:var(--src)}.p-pending{background:var(--ground);color:var(--muted);border:1px solid var(--line)}
td.by{color:var(--muted);font-size:12.5px;white-space:nowrap}
.tblwrap{overflow-x:auto}

details.guide{margin-top:14px}
details.guide summary{cursor:pointer;color:var(--muted);font-size:13.5px}
.guide .bd{font-size:13.5px}
.guide dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:8px 0 0}
.guide dt{font-weight:600}
.guide dd{margin:0;color:var(--muted)}

.gate{max-width:440px;margin:48px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:22px 24px}
.gate h2{font:500 22px/1.2 "IBM Plex Serif",Georgia,serif;margin:0 0 6px}
.gate p{margin:6px 0;color:var(--muted);font-size:14px}
.gate .row{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.gate .err{color:var(--bad);font-size:13.5px;min-height:18px;margin-top:8px}
.banner{margin-top:14px;border:1px solid var(--sun);background:var(--sun-soft);border-radius:10px;padding:10px 14px;font-size:13.5px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);padding:20px 22px;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{font:500 20px/1.2 "IBM Plex Serif",Georgia,serif;margin:0 0 6px}
dialog p{margin:6px 0;color:var(--muted);font-size:14px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
@media (prefers-reduced-motion:no-preference){.dbtn,.blk,.btn{transition:background .12s,border-color .12s}}
/* simple mode: one word, three choices */
body.simple .noterow,body.simple #claimBtn,body.simple details.guide{display:none}
body.simple .tbl .hd{font-size:13px}

.ask{margin-top:12px;font-size:14px;font-weight:500}
.metaform{margin-top:12px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-items:end}
.metaform label{margin:0 0 4px}
.metaform select{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;font:inherit;background:var(--surface);color:var(--ink)}
.metaform .full{grid-column:1 / -1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.metaform .err{color:var(--bad);font-size:13px}
@media (max-width:700px){.decide{grid-template-columns:repeat(2,minmax(0,1fr))}.metaform{grid-template-columns:1fr}}

.langbtn{font-family:"IBM Plex Mono",monospace;font-size:12px}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1 data-i18n="title">Nirxandina Peyvên Kurmancî</h1><span class="letters">ç ê î ş û</span></div>
  <span class="chip"><span class="eyebrow" data-i18n="queue">Lîste</span> <b id="queueName">—</b></span>
  <span class="chip" id="reviewerChip" hidden><span class="eyebrow" data-i18n="reviewer">Nirxîner</span> <b id="reviewerName">—</b></span>
  <span class="chip" id="mineChip" hidden><span class="eyebrow" data-i18n="mine">Peyvên te</span> <b id="mineText">—</b></span>
  <button class="btn quiet" id="detailsBtn" hidden></button>
  <button class="btn" id="exportBtn" hidden data-i18n="export">Biryaran dakêşe</button>
  <button class="btn quiet" id="signOut" hidden data-i18n="signOut">Derkeve</button>
  <button class="btn quiet langbtn" id="langBtn" data-i18n="lang">English</button>
</header>

<div id="configMissing" class="banner" hidden data-i18n="configMissing"></div>

<section class="gate" id="loginCard" hidden>
  <h2 data-i18n="loginTitle">Têkeve</h2>
  <p data-i18n="loginText"></p>
  <form id="loginForm">
    <label for="loginEmail" data-i18n="email">E-name</label><input type="email" id="loginEmail" autocomplete="username" required>
    <label for="loginPassword" data-i18n="password">Şîfre</label><input type="password" id="loginPassword" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <div class="row"><button class="btn quiet" type="button" id="forgotBtn" data-i18n="forgot">Şîfre ji bîr kir?</button><button class="btn primary" type="submit" data-i18n="signIn">Têkeve</button></div>
  </form>
</section>

<section class="gate" id="onboardCard" hidden>
  <h2 data-i18n="welcomeTitle">Bi xêr hatî</h2>
  <p data-i18n="welcomeText"></p>
  <form id="onboardForm">
    <label for="handleInput" data-i18n="handle">Navê nirxîner</label><input type="text" id="handleInput" autocomplete="off" spellcheck="false" required>
    <div id="pwFields">
      <label for="pwInput" data-i18n="setPassword"></label><input type="password" id="pwInput" autocomplete="new-password" minlength="8">
    </div>
    <div class="err" id="onboardErr"></div>
    <div class="row"><span></span><button class="btn primary" type="submit" data-i18n="start">Dest bi nirxandinê bike</button></div>
  </form>
</section>

<section class="gate" id="resetCard" hidden>
  <h2 data-i18n="newPasswordTitle">Şîfreya nû</h2>
  <form id="resetForm">
    <label for="resetPw" data-i18n="newPassword"></label><input type="password" id="resetPw" autocomplete="new-password" minlength="8" required>
    <div class="err" id="resetErr"></div>
    <div class="row"><span></span><button class="btn primary" type="submit" data-i18n="savePassword">Şîfreyê tomar bike</button></div>
  </form>
</section>

<div class="wrap" id="app" hidden>
  <aside class="rail">
    <section class="panel">
      <div class="hd"><span class="eyebrow" data-i18n="progress">Pêşketin</span><span class="num" id="progressText">0 / 0</span></div>
      <div class="bd progress"><div class="bar" id="progressBar"></div><div class="legend" id="legend"></div></div>
    </section>
    <section class="panel">
      <div class="hd"><span class="eyebrow" data-i18n="blocks">Komên 50 peyvan</span><button class="btn quiet" id="nextOpenBlock" style="padding:0 6px;font-size:12.5px" data-i18n="nextOpenBlock">koma vala ya pêş</button></div>
      <div class="blocks" id="blocks"></div>
    </section>
  </aside>

  <main>
    <section class="focus" id="focus" aria-live="polite">
      <div class="meta"><span class="rank"><span data-i18n="rank">rêz</span> <b id="rank">—</b> <span data-i18n="of">ji</span> <span id="total">—</span></span><span id="decidedBy"></span></div>
      <div class="word" id="word">—</div>
      <div class="facts" id="facts"></div>
      <div class="note-hint" id="hint"></div>
      <div class="decide" id="decide">
        <button class="dbtn" data-s="approved"><span class="head"><span class="t"></span><span class="key">1</span></span><span class="code">approved</span><span class="s"></span></button>
        <button class="dbtn" data-s="metadata"><span class="head"><span class="t"></span><span class="key">2</span></span><span class="code">approved_with_metadata_change</span><span class="s"></span></button>
        <button class="dbtn" data-s="rejected"><span class="head"><span class="t"></span><span class="key">3</span></span><span class="code">rejected_from_default_pack</span><span class="s"></span></button>
        <button class="dbtn" data-s="experimental"><span class="head"><span class="t"></span><span class="key">4</span></span><span class="code">experimental_only</span><span class="s"></span></button>
        <button class="dbtn" data-s="linguist"><span class="head"><span class="t"></span><span class="key">5</span></span><span class="code">needs_linguist</span><span class="s"></span></button>
        <button class="dbtn" data-s="source"><span class="head"><span class="t"></span><span class="key">6</span></span><span class="code">needs_source_investigation</span><span class="s"></span></button>
      </div>
      <form class="metaform" id="metaForm" hidden>
        <div><label for="metaDisplay" data-i18n="metaDisplay"></label><input type="text" id="metaDisplay" autocomplete="off" spellcheck="false"></div>
        <div><label for="metaPos" data-i18n="metaPos"></label><select id="metaPos"></select></div>
        <div class="full"><button class="btn primary" type="submit" data-i18n="metaSave"></button><button class="btn quiet" type="button" id="metaCancel" data-i18n="cancel"></button><span class="err" id="metaErr"></span></div>
      </form>
      <div class="noterow">
        <input type="text" id="note" autocomplete="off">
        <button class="btn" id="saveNote" data-i18n="saveNote"></button>
        <button class="btn quiet" id="clearDecision" data-i18n="clear"></button>
      </div>
      <div class="ask" id="ask" hidden></div>
      <div class="reasons" id="reasons"></div>
      <div class="status-line" id="statusLine"></div>
      <button class="btn" id="undoBtn" type="button" hidden style="margin-top:6px"></button>
      <div class="navrow">
        <button class="btn" id="prev" data-i18n="prev"></button>
        <button class="btn" id="next" data-i18n="next"></button>
        <button class="btn primary" id="nextOpen" data-i18n="nextOpen"></button>
        <span class="spacer"></span>
        <button class="btn" id="claimBtn"></button>
      </div>
      <details class="guide">
        <summary data-i18n="guideSummary"></summary>
        <div class="bd">
          <p id="guideIntro"></p>
          <dl id="guideList"></dl>
          <p id="guideKeys"></p>
        </div>
      </details>
    </section>

    <section class="panel tbl">
      <div class="hd"><span class="eyebrow"><span data-i18n="block">Kom</span> <span id="blockLabel">—</span></span><span id="blockClaim" style="font-size:13px;color:var(--muted)"></span></div>
      <div class="tblwrap"><table>
        <thead><tr><th>#</th><th data-i18n="thWord"></th><th data-i18n="thPos"></th><th class="num" data-i18n="thDocs"></th><th data-i18n="thDecision"></th><th data-i18n="thBy"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </section>
  </main>
</div>

<dialog id="overrideDialog">
  <h2 data-i18n="overrideTitle"></h2>
  <p id="overrideText"></p>
  <div class="row"><button class="btn" id="overrideNo" data-i18n="keepTheirs"></button><button class="btn primary" id="overrideYes" data-i18n="replaceMine"></button></div>
</dialog>

<script>
  window.__authLinkType = (new URLSearchParams((location.hash || '').replace(/^#/, ''))).get('type') || '';
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="lang.js"></script>
<script src="queue-hunspell-kuwiki-001.js"></script>
<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const RAW = window.REVIEW_QUEUE, Q = RAW.summary, QID = Q.queue_id, BLOCK = 50;
  const C = RAW.candidates.map(a => ({rank:a[0], tid:a[1], display:a[2], normalized:a[3]||a[2].toLowerCase(), pos:a[4], morph:a[5], flags:a[6], line:a[7], docs:a[8], toks:a[9], audit:a[10]}));
  const N = C.length, NB = Math.ceil(N / BLOCK);
  const byTid = new Map(C.map((c,i)=>[c.tid,i]));
  const ORDER = ['approved','metadata','rejected','experimental','linguist','source'];
  const REPO = {approved:'approved', metadata:'approved_with_metadata_change', rejected:'rejected_from_default_pack', experimental:'experimental_only', linguist:'needs_linguist', source:'needs_source_investigation'};
  const DEFAULT_NOTE = {approved:'Human-approved lexical entry; imported Hunspell metadata accepted as-is.', metadata:'Human-approved lexical entry with corrected metadata.', rejected:'', experimental:'Human review: retain only in experimental vocabulary.', linguist:'Needs linguist', source:'Needs source investigation'};
  const POS_VALUES = ['noun_fem','noun_masc','noun_fem_masc','noun','adjective','adverb','verb','propn','num','sconj','adp','pronoun','intj','adj_adv'];
  const normalizeText = t => Array.from(t).filter(ch => !/[\p{C}]/u.test(ch) && ch!=='​' && ch!=='﻿').join('').normalize('NFC').toLowerCase();
  const fmt = n => Number(n).toLocaleString('en-US');
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const blockOf = i => Math.floor(i / BLOCK);

  // ---------- language ----------
  const LANGS = window.REVIEW_DESK_LANG; let lang = 'ku';
  try { lang = localStorage.getItem('krd.lang') === 'en' ? 'en' : 'ku'; } catch(e){}
  let L = LANGS[lang];
  const t = (key, vars) => { let s = L[key]; if (s == null) s = LANGS.en[key] || key; if (vars) for (const k in vars) s = s.split('{'+k+'}').join(vars[k]); return s; };
  const label = s => L.status[s].label;

    $('guideList').innerHTML = ORDER.map(s => `<dt>${esc(label(s))} <span class="code" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted)">${REPO[s]}</span></dt><dd>${esc(L.guide[s])}</dd>`).join('');

  }

  // ---------- state ----------
  let sb = null, session = null, me = null;
  const decisions = new Map(), claims = new Map();
  let cur = 0;
  try { const s = parseInt(localStorage.getItem('krd.cur.'+QID),10); if(!isNaN(s) && s>=0 && s<N) cur = s; } catch(e){}
  let simple = true;
  try { simple = localStorage.getItem('krd.simple') !== 'off'; } catch(e){}
  let pendingReject = false, last = null;
  const decisionOf = c => decisions.get(c.tid) || null;
  function counts(range){ const k={approved:0,metadata:0,rejected:0,experimental:0,linguist:0,source:0,pending:0}; for(const c of range){const d=decisionOf(c); k[d?d.status:'pending']++;} return k; }
  function show(id){ for (const s of ['loginCard','onboardCard','resetCard','app']) $(s).hidden = (s !== id); }

  function applyMode(){ document.body.classList.toggle('simple', simple); $('detailsBtn').textContent = simple ? t('showDetails') : t('simpleView'); try{localStorage.setItem('krd.simple', simple?'on':'off');}catch(e){} }
  function myBlocks(){ const out=[]; for (const [b,cl] of claims) if (me && cl.handle===me.handle) out.push(b); return out.sort((a,b)=>a-b); }
  function pendingIn(b){ return counts(C.slice(b*BLOCK,(b+1)*BLOCK)).pending; }
  async function ensureMyBlock(){
    for (const b of myBlocks()) if (pendingIn(b)>0) return b;
    for (let b=0;b<NB;b++){ if (!claims.get(b) && pendingIn(b)>0){ const {error}=await sb.from('block_claims').upsert({queue_id:QID, block_no:b},{onConflict:'queue_id,block_no'}); if(!error){ claims.set(b,{block_no:b,handle:me.handle}); return b; } } }
    return -1;
  }

  // ---------- render ----------
  function renderMine(){
    const bs = myBlocks(); if (!bs.length){ $('mineText').textContent=t('mineNone'); return; }
    const b = bs.find(x=>pendingIn(x)>0); const shown = b==null ? bs[bs.length-1] : b; const range=C.slice(shown*BLOCK,(shown+1)*BLOCK);
    $('mineText').textContent = t('mineText', {from:fmt(range[0].rank), to:fmt(range[range.length-1].rank), done:range.length-pendingIn(shown), n:range.length});
  }
  function renderProgress(){

    $('progressBar').innerHTML = ORDER.concat('pending').map(s=>`<span class="d-${s}" style="width:${(k[s]/N*100).toFixed(2)}%"></span>`).join('');
    $('legend').innerHTML = ORDER.concat('pending').map(s=>`<span class="k"><i class="dot d-${s}"></i>${esc(s==='pending'?t('undecided'):label(s))}</span><span class="num">${fmt(k[s])}</span>`).join('');
  }
  function renderBlocks(){
    const b0 = blockOf(cur); let html='';
    for (let b=0;b<NB;b++){
      const range=C.slice(b*BLOCK,(b+1)*BLOCK); const k=counts(range); const done=range.length-k.pending; const cl=claims.get(b);
      html += `<button class="blk${b===b0?' active':''}" data-b="${b}"><span class="n num">${String(b+1).padStart(3,'0')}</span><span><span class="range num">${fmt(range[0].rank)}–${fmt(range[range.length-1].rank)}</span><span class="mini"><span style="width:${(done/range.length*100).toFixed(0)}%"></span></span></span><span class="who${cl&&me&&cl.handle===me.handle?' me':''}">${cl?esc(cl.handle):(done===range.length?t('done'):t('open'))}</span></button>`;
    }

  }
  function renderFocus(){
    const c=C[cur]; const d=decisionOf(c);
    $('rank').textContent=fmt(c.rank); $('total').textContent=fmt(N);
    $('word').innerHTML = esc(c.display) + (c.normalized!==c.display?`<small>${esc(c.normalized)}</small>`:'');
    $('decidedBy').innerHTML = d ? `<span class="pill p-${d.status}">${esc(label(d.status))}</span> ${esc(t('by'))} <b>${esc(d.handle)}</b> · ${String(d.decided_at).slice(0,10)}${d.status==='metadata'&&d.meta?` · ${esc(t('correctedTo'))} <b>${esc(d.meta.display)}</b> (${esc(posName(d.meta.part_of_speech))})`:''}` : `<span class="pill p-pending">${esc(t('undecided'))}</span>`;
    $('metaForm').hidden = true; $('metaErr').textContent='';
    const facts=[
      [t('factPos'), esc(posName(c.pos))],
      [t('factMorph'), `<span class="mono">${esc(c.morph||'—')}</span>`],
      [t('factDocs'), `<span class="num">${fmt(c.docs)}</span> <span style="color:var(--muted)">· ${fmt(c.toks)} ${esc(t('occurrences'))}</span>`],
      [t('factLine'), `<span class="mono">kmr-Latn.dic:${esc(c.line)}</span>${c.flags?` <span class="mono" style="color:var(--muted)">${esc(t('flags'))} ${esc(c.flags)}</span>`:''}`],
    ];
    if (c.audit) facts.push([t('factAudit'), c.audit.split(',').map(a=>`<span class="flag">${esc(a)}</span>`).join('')]);
    if (/^[A-ZÇÊÎŞÛ]/.test(c.display)) facts.push([t('factCap'), esc(t('capHint'))]);
    $('facts').innerHTML = facts.map(([l,v])=>`<div class="fact"><div class="l">${esc(l)}</div><div class="v">${v}</div></div>`).join('');
    document.querySelectorAll('.dbtn').forEach(b=>b.classList.toggle('on', !!d && d.status===b.dataset.s));
    $('note').value = d && d.note ? d.note : '';
    renderReasons(d?d.status:null);
    const cl = claims.get(blockOf(cur));
    $('claimBtn').textContent = cl ? (me && cl.handle===me.handle ? t('release') : t('claimedBy',{who:cl.handle})) : t('claim');
    try { localStorage.setItem('krd.cur.'+QID, String(cur)); } catch(e){}
  }
  function renderReasons(s){ $('reasons').innerHTML = (s && L.reasons[s] ? L.reasons[s] : []).map(r=>`<button class="reason" type="button" data-r="${esc(r)}">${esc(r)}</button>`).join(''); }
  function renderTable(){
    const b=blockOf(cur); const range=C.slice(b*BLOCK,(b+1)*BLOCK); const cl=claims.get(b);
    $('blockLabel').textContent = String(b+1).padStart(3,'0')+' · '+t('ranks')+' '+fmt(range[0].rank)+'–'+fmt(range[range.length-1].rank);
    $('blockClaim').textContent = cl ? t('claimedShort',{who:cl.handle}) : t('unclaimed');
    $('rows').innerHTML = range.map(c=>{const d=decisionOf(c); const i=byTid.get(c.tid);
      return `<tr class="row${i===cur?' cur':''}" data-i="${i}"><td class="num" style="color:var(--muted)">${fmt(c.rank)}</td><td class="w">${esc(c.display)}</td><td>${esc(posName(c.pos))}</td><td class="num">${fmt(c.docs)}</td><td>${d?`<span class="pill p-${d.status}">${esc(label(d.status))}</span>`:'<span class="pill p-pending">—</span>'}</td><td class="by">${d?esc(d.handle):''}</td></tr>`;}).join('');
  }
  function renderAll(){ renderProgress(); renderBlocks(); renderFocus(); renderTable(); renderMine(); }
  function goTo(i, scroll){ if(i<0||i>=N) return; pendingReject=false; $('ask').hidden=true; const cb=blockOf(i)!==blockOf(cur); cur=i; renderFocus(); if(cb) renderBlocks(); renderTable(); if(scroll!==false) window.scrollTo({top:0,behavior:'smooth'}); }
  function nextUndecided(from){ for(let i=from;i<N;i++) if(!decisionOf(C[i])) return i; for(let i=0;i<from;i++) if(!decisionOf(C[i])) return i; return -1; }
  async function nextForMe(from){
    if (!simple) return nextUndecided(from);
    const b = await ensureMyBlock(); if (b<0) return -1;
    const lo=b*BLOCK, hi=Math.min(N,(b+1)*BLOCK);
    for(let i=Math.max(lo,from);i<hi;i++) if(!decisionOf(C[i])) return i;
    for(let i=lo;i<hi;i++) if(!decisionOf(C[i])) return i;
    return -1;
  }

  // ---------- data ----------
  async function loadAll(){
    decisions.clear(); claims.clear();
    for (let from=0;;from+=1000){
      const {data, error} = await sb.from('decisions').select('*').eq('queue_id', QID).order('rank').range(from, from+999);
      if (error) throw error;
      for (const r of data) decisions.set(r.target_id, r);
      if (data.length < 1000) break;
    }
    const {data: cl, error: e2} = await sb.from('block_claims').select('*').eq('queue_id', QID);
    if (e2) throw e2;
    for (const r of cl) claims.set(r.block_no, r);
  }
  function subscribeLive(){
    sb.channel('desk-'+QID)
      .on('postgres_changes', {event:'*', schema:'public', table:'decisions', filter:'queue_id=eq.'+QID}, p => {
        if (p.eventType==='DELETE') { if (p.old && p.old.target_id) decisions.delete(p.old.target_id); }
        else if (p.new) decisions.set(p.new.target_id, p.new);
        renderAll();
      })
      .on('postgres_changes', {event:'*', schema:'public', table:'block_claims', filter:'queue_id=eq.'+QID}, p => {
        if (p.eventType==='DELETE') { if (p.old && p.old.block_no!=null) claims.delete(p.old.block_no); }
        else if (p.new) claims.set(p.new.block_no, p.new);
        renderAll();
      })
      .subscribe();
    setInterval(() => loadAll().then(renderAll).catch(()=>{}), 60000);
  }
  function errMsg(e){ return (e && (e.message || e.error_description || e.code)) || String(e); }

  async function writeDecision(c, status, note, meta){
    const row = {queue_id:QID, target_id:c.tid, rank:c.rank, display:c.display, status, note};
    if (status==='metadata') row.meta = meta;
    const {error} = await sb.from('decisions').upsert(row, {onConflict:'queue_id,target_id'});
    if (error && /'meta' column/.test(error.message||'')) { setStatus(t('needsMigration'), true); return false; }
    if (error) { setStatus(t('couldNotSave')+errMsg(error), true); return false; }
    const b = blockOf(byTid.get(c.tid));
    if (!claims.get(b)) await sb.from('block_claims').upsert({queue_id:QID, block_no:b}, {onConflict:'queue_id,block_no'});
    return true;
  }
  function openMetaForm(){
    const c=C[cur]; const d=decisionOf(c);
    $('metaDisplay').value = d&&d.meta ? d.meta.display : c.display;
    $('metaPos').innerHTML = POS_VALUES.map(v=>`<option value="${v}">${esc(posName(v))} (${v})</option>`).join('');
    $('metaPos').value = (d&&d.meta ? d.meta.part_of_speech : (POS_VALUES.includes(c.pos)?c.pos:'noun'));
    document.querySelectorAll('.dbtn').forEach(b=>b.classList.toggle('on', b.dataset.s==='metadata'));
    $('metaErr').textContent=''; $('metaForm').hidden=false; $('metaDisplay').focus();
  }
  async function decide(s, meta){
    const c=C[cur]; const prev=decisionOf(c);
    if (s==='metadata' && !meta) { openMetaForm(); return; }
    const note = $('note').value.trim() || DEFAULT_NOTE[s];
    if (s==='rejected' && !note){ pendingReject = true; $('ask').hidden=false; $('ask').textContent=t('askWhy',{word:c.display}); renderReasons('rejected'); document.querySelectorAll('.dbtn').forEach(b=>b.classList.toggle('on', b.dataset.s==='rejected')); if(!simple) $('note').focus(); return; }
    pendingReject = false; $('ask').hidden=true;
    if (prev && prev.handle!==me.handle && !(await confirmOverride(prev))) return;
    if (await writeDecision(c, s, note, meta)) {
      last = {i:cur, prev: prev ? Object.assign({}, prev) : null}; $('undoBtn').hidden=false; $('undoBtn').textContent = t('undo',{word:c.display, label:label(s)});
      decisions.set(c.tid, Object.assign({}, prev||{}, {target_id:c.tid, status:s, note, meta:meta||null, handle:me.handle, decided_at:new Date().toISOString()}));
      setStatus(`${label(s)} · ${c.display}`); renderAll();
      const nx=await nextForMe(cur+1); if(nx>=0) goTo(nx,false); else setStatus(simple ? t('rangeDone') : t('allDone'));
    }
  }
  async function saveNoteOnly(){
    const c=C[cur]; const d=decisionOf(c); if(!d){ setStatus(t('pickStatusFirst'), true); return; }
    if (d.handle!==me.handle && !(await confirmOverride(d))) return;
    if (await writeDecision(c, d.status, $('note').value.trim(), d.meta)) { d.note=$('note').value.trim(); d.handle=me.handle; setStatus(t('noteSaved')); renderAll(); }
  }
  async function clearDecision(){
    const c=C[cur]; const d=decisionOf(c); if(!d) return;
    if (d.handle!==me.handle && !(await confirmOverride(d))) return;
    const {error} = await sb.from('decisions').delete().match({queue_id:QID, target_id:c.tid});
    if (error) { setStatus(t('couldNotClear')+errMsg(error), true); return; }
    decisions.delete(c.tid); setStatus(t('cleared')); renderAll();
  }
  function confirmOverride(prev){
    return new Promise(res=>{
      $('overrideText').textContent = t('overrideText',{who:prev.handle, label:label(prev.status), date:String(prev.decided_at).slice(0,10)});
      const dlg=$('overrideDialog'); dlg.showModal();
      const done=v=>{ dlg.close(); $('overrideYes').onclick=$('overrideNo').onclick=null; res(v); };
      $('overrideYes').onclick=()=>done(true); $('overrideNo').onclick=()=>done(false); dlg.oncancel=()=>done(false);
    });
  }
  async function toggleClaim(){
    const b=blockOf(cur); const cl=claims.get(b); let error;
    if (!cl) ({error} = await sb.from('block_claims').upsert({queue_id:QID, block_no:b}, {onConflict:'queue_id,block_no'}));
    else if (cl.handle===me.handle) ({error} = await sb.from('block_claims').delete().match({queue_id:QID, block_no:b}));
    else { setStatus(t('blockTaken',{who:cl.handle}), true); return; }
    if (error) setStatus(t('claimFailed')+errMsg(error), true);
    else { if (!cl) claims.set(b,{block_no:b,handle:me.handle}); else claims.delete(b); renderAll(); }
  }

  // ---------- export ----------
  function exportJson(){
    const recs=[];
    for (const c of C){ const d=decisionOf(c); if(!d) continue;
      const rec={schema_version:'review-decision-v1', target_type:'entry', target_id:c.tid, source_id:Q.source_id, review_status:REPO[d.status], reviewer_id:d.handle, review_date:String(d.decided_at).slice(0,10), review_notes:d.note||DEFAULT_NOTE[d.status]||REPO[d.status], evidence:[]};
      if (d.status==='metadata' && d.meta) rec.replacement_metadata = {display:d.meta.display, normalized:d.meta.normalized, flags:d.meta.flags||'', morphology:d.meta.morphology||[], part_of_speech:d.meta.part_of_speech};
      recs.push(rec); }
    if (!recs.length){ setStatus(t('nothingToExport'), true); return; }
    const text=JSON.stringify({schema_version:'review-desk-export-v1', queue_id:QID, source_id:Q.source_id, source_revision:Q.source_revision, exported_at:new Date().toISOString(), decisions:recs}, null, 1);
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=`${QID}-decisions-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); a.remove();
    setStatus(t('exported',{n:recs.length}));
  }

  // ---------- events ----------
  document.querySelectorAll('.dbtn').forEach(b=>b.addEventListener('click',()=>decide(b.dataset.s)));
  $('reasons').addEventListener('click', e=>{ const r=e.target.closest('.reason'); if(!r) return; const inp=$('note');
    if (pendingReject) { inp.value = r.dataset.r; decide('rejected'); return; }
    inp.value = inp.value ? inp.value+'; '+r.dataset.r : r.dataset.r; if (decisionOf(C[cur])) saveNoteOnly(); else inp.focus(); });
  $('metaForm').onsubmit = e => { e.preventDefault(); const c=C[cur];
    const display=$('metaDisplay').value.trim(); const pos=$('metaPos').value; const normalized=normalizeText(display);

    if (display===c.display && pos===c.pos) { $('metaErr').textContent=t('metaSame'); return; }
    const morphology = pos===c.pos ? (c.morph ? c.morph.split(';') : []) : ['po:'+pos];
    decide('metadata', {display, normalized, flags:c.flags||'', morphology, part_of_speech:pos}); };
  $('metaCancel').onclick = () => { $('metaForm').hidden=true; renderFocus(); };
  $('undoBtn').onclick = async () => {
    if (!last) return; const c=C[last.i]; let ok;
    if (last.prev) { ok = await writeDecision(c, last.prev.status, last.prev.note||'', last.prev.meta||null); if (ok) decisions.set(c.tid, last.prev); }
    else { const {error} = await sb.from('decisions').delete().match({queue_id:QID, target_id:c.tid}); ok = !error; if (ok) decisions.delete(c.tid); else setStatus(t('couldNotUndo')+errMsg(error), true); }
    if (ok) { const i=last.i; last=null; $('undoBtn').hidden=true; goTo(i,false); const d=decisionOf(c); setStatus(t('undone',{word:c.display, state:d?label(d.status):t('undecided').toLowerCase()})); renderAll(); }
  };
  $('detailsBtn').onclick = () => { simple = !simple; applyMode(); renderAll(); };
  $('langBtn').onclick = () => { lang = lang==='ku' ? 'en' : 'ku'; applyLang(); if (!$('app').hidden) renderAll(); };
  $('saveNote').onclick=saveNoteOnly; $('clearDecision').onclick=clearDecision;
  $('prev').onclick=()=>goTo(cur-1); $('next').onclick=()=>goTo(cur+1);
  $('nextOpen').onclick=async()=>{ const i=await nextForMe(cur+1); if(i>=0) goTo(i); else setStatus(t('allDone')); };
  $('claimBtn').onclick=toggleClaim; $('exportBtn').onclick=exportJson;
  $('blocks').addEventListener('click', e=>{ const b=e.target.closest('.blk'); if(b) goTo(parseInt(b.dataset.b,10)*BLOCK); });
  $('rows').addEventListener('click', e=>{ const r=e.target.closest('tr.row'); if(r) goTo(parseInt(r.dataset.i,10)); });
  $('nextOpenBlock').onclick=()=>{ for(let b=0;b<NB;b++){ if(!claims.get(b) && pendingIn(b)>0){ goTo(b*BLOCK); return; } } setStatus(t('noOpenBlock')); };
  document.addEventListener('keydown', e=>{
    if ($('app').hidden) return;
    if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT'||document.querySelector('dialog[open]')) { if(e.key==='Escape') e.target.blur(); return; }
    if (e.metaKey||e.ctrlKey||e.altKey) return;
    const map={'1':'approved','2':'metadata','3':'rejected','4':'experimental','5':'linguist','6':'source'};
    if (map[e.key]) { e.preventDefault(); decide(map[e.key]); }
    else if (e.key==='ArrowLeft') { e.preventDefault(); goTo(cur-1,false); }
    else if (e.key==='ArrowRight') { e.preventDefault(); goTo(cur+1,false); }
    else if (e.key==='Enter') { e.preventDefault(); $('nextOpen').click(); }
    else if (e.key==='Backspace'||e.key==='0') { e.preventDefault(); clearDecision(); }
    else if (e.key==='n'||e.key==='N') { e.preventDefault(); $('note').focus(); }
  });

  // ---------- auth ----------
  $('loginForm').onsubmit = async e => { e.preventDefault(); $('loginErr').textContent='';
    const {error} = await sb.auth.signInWithPassword({email:$('loginEmail').value.trim(), password:$('loginPassword').value});
    if (error) $('loginErr').textContent = errMsg(error); };
  $('forgotBtn').onclick = async () => { const email=$('loginEmail').value.trim(); if(!email){ $('loginErr').textContent=t('typeEmailFirst'); return; }
    const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.href.split('#')[0]});
    $('loginErr').textContent = error ? errMsg(error) : t('resetSent'); };
  $('onboardForm').onsubmit = async e => { e.preventDefault(); $('onboardErr').textContent='';
    const handle=$('handleInput').value.trim().toLowerCase();
    if (!/^[a-z0-9][a-z0-9-]{1,39}$/.test(handle)) { $('onboardErr').textContent=t('handleInvalid'); return; }
    const pw=$('pwInput').value;
    if (!$('pwFields').hidden && pw.length<8) { $('onboardErr').textContent=t('passwordShort'); return; }
    if (!$('pwFields').hidden) { const {error} = await sb.auth.updateUser({password:pw}); if (error) { $('onboardErr').textContent=errMsg(error); return; } }
    const {error} = await sb.from('reviewers').insert({user_id:session.user.id, handle});
    if (error) { $('onboardErr').textContent = /duplicate|unique/i.test(errMsg(error)) ? t('handleTaken') : errMsg(error); return; }
    me={id:session.user.id, handle}; await enterApp(); };
  $('resetForm').onsubmit = async e => { e.preventDefault(); const {error} = await sb.auth.updateUser({password:$('resetPw').value});
    if (error) { $('resetErr').textContent=errMsg(error); return; } await afterSignIn(); };
  $('signOut').onclick = async () => { await sb.auth.signOut(); location.reload(); };

  async function afterSignIn(){
    const {data, error} = await sb.from('reviewers').select('handle').eq('user_id', session.user.id).maybeSingle();
    if (error) { show('loginCard'); $('loginErr').textContent=errMsg(error); return; }
    if (!data) { $('pwFields').hidden = !/^(invite|recovery|magiclink|signup)$/.test(window.__authLinkType); show('onboardCard'); $('handleInput').focus(); return; }
    me={id:session.user.id, handle:data.handle}; await enterApp();
  }
  async function enterApp(){
    $('reviewerName').textContent=me.handle; $('reviewerChip').hidden=false; $('exportBtn').hidden=false; $('signOut').hidden=false; $('mineChip').hidden=false; $('detailsBtn').hidden=false;
    applyMode(); show('app');
    try { await loadAll(); } catch(e){ setStatus(t('loadFailed')+errMsg(e), true); }
    renderAll(); subscribeLive();
    if (simple) { const i = await nextForMe(cur); if (i>=0) goTo(i,false); }
  }

  // ---------- boot ----------
  applyLang();
  $('queueName').textContent = Q.queue_label || QID;
  const cfg = window.REVIEW_DESK_CONFIG || {};
  if (!cfg.supabaseUrl || /YOUR-PROJECT/.test(cfg.supabaseUrl) || !window.supabase) { $('configMissing').hidden=false; show('loginCard'); return; }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  let booted=false;
  sb.auth.onAuthStateChange((event, s) => {
    session = s;
    if (event==='PASSWORD_RECOVERY') { show('resetCard'); return; }
    if (!session) { show('loginCard'); return; }
    if (!booted) { booted=true; afterSignIn(); }
  });
  sb.auth.getSession().then(({data}) => { if (!data.session && !booted) show('loginCard'); });
})();
</script>

</body>
</html>
